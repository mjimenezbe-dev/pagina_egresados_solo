<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Universidad CENFOTEC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="estilos-unificados.css">
</head>
<body class="pagina-login">
    <header>
      <div class="contenedor-header">
        <section class="logo">
          <img src="imagenes/logo_principal.png" alt="logo">
        </section>

        <nav>
          <ul>
        
          </ul>
        </nav>
      </div>
    </header>

    <main>
        <div class="login-container">
            <div class="login-content">
                <section class="encabezado">
                    <h1>¡Bienvenido!</h1>
                    <p>Inicia sesión para obtener los beneficios de egresado.</p>
                </section>

                <p id="mensajeLogin" class="mensaje-login" style="display: none;"></p>

                <form class="formulario" id="formularioLogin">
                    <label for="usuario">Usuario / Correo</label>
                    <input type="text" id="usuario" placeholder="bienestar o egresado" autocomplete="username" required>

                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="Tu contraseña" autocomplete="current-password" required>

                    <button type="submit">Iniciar sesión</button>
                </form>

                <p class="demo-info">
                    Demo: <strong>bienestar@cenfotec.ac.cr</strong> &nbsp;·&nbsp; 
                    <strong>egresado@cenfotec.ac.cr</strong> <br>
                    (Contraseña para todos: <strong>123456</strong>)
                </p>
            </div>

            <div class="imagen-panel">
                <img src="imagenes/logoGrande.png" alt="Universidad CENFOTEC">
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Universidad CENFOTEC · Programa de Egresados</p>
        <p>Todos los derechos reservados</p>
    </footer>

    <script src="datos.js"></script>
    <script src="sitio.js"></script>
    <script src="login.js"></script>
</body>
</html>
