<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos-unificados.css">
</head>
<body class="pagina-login">
    <header>
        <section class="logo">
            <img src="imagenes/logo_principal.png" alt="logo">
        </section>

    
        </nav>
    </header>

    <main>
        <div class="login-container">
            <div class="login-content">
                <section class="encabezado">
                    <h1>¡Bienvenido!</h1>
                    <p>Inicia sesión para obtener los beneficios de egresado.</p>
                </section>

                <p id="mensajeLogin" class="mensaje-login"></p>

                <form class="formulario" id="formularioLogin">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="admin o egresado" autocomplete="username">

                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="Tu contraseña" autocomplete="current-password">

                    <button type="submit">Iniciar sesión</button>
                </form>

                <p style="margin-top: 16px; font-size: 13px; color: #999;">
                    Demo: usuario <strong>admin</strong> / contraseña <strong>admin123</strong>
                    &nbsp;·&nbsp; usuario <strong>egresado</strong> / contraseña <strong>egresado123</strong>
                </p>
            </div>

            <div class="imagen-panel">
                <img src="/imagenes/logoGrande.png" alt="Universidad CENFOTEC">
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Universidad CENFOTEC · Programa de Egresados</p>
        <p>Todos los derechos reservados</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
